# After CI passes on main: when project() VERSION in CMakeLists.txt has no release yet, platform/release.sh builds
# both apps with JD_RELEASE=1 and publishes vX.Y.Z. The APK is signed with the key every earlier release used
# (secret ANDROID_KEYSTORE_B64), or phones would refuse the update.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Version
        id: version
        run: |
          v=$(sed -n 's/^project(jackdaw VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=v$v" >>"$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=0" >>"$GITHUB_OUTPUT"; else echo "new=1" >>"$GITHUB_OUTPUT"; fi
      - name: Packages
        if: steps.version.outputs.new == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config autoconf automake libtool make ccache \
            libssl-dev libcurl4-openssl-dev zlib1g-dev libsystemd-dev libsecret-1-dev libfontconfig1-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev
      - uses: actions/setup-java@v4
        if: steps.version.outputs.new == '1'
        with:
          distribution: temurin
          java-version: 17
      # the caches CI saved on main (same keys), so a release rebuilds only jackdaw itself
      - name: Cache Android SDK packages
        id: sdk
        if: steps.version.outputs.new == '1'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/build-tools/36.1.0
            /usr/local/lib/android/sdk/platforms/android-36.1
          key: android-sdk-ndk28.2.13676358-bt36.1.0-p36.1
      - name: Cache Linux third-party builds
        if: steps.version.outputs.new == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jackdaw/linux
            !~/.cache/jackdaw/linux/build
            !~/.cache/jackdaw/linux/build-debug
          key: linux-${{ hashFiles('platform/versions.sh', 'platform/linux/deps.sh') }}
      - name: Cache Android third-party builds
        if: steps.version.outputs.new == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jackdaw/android
            !~/.cache/jackdaw/android/debug.keystore
            !~/.cache/jackdaw/android/out
            !~/.cache/jackdaw/android/apk
            !~/.cache/jackdaw/android/build-*
          key: android-${{ hashFiles('platform/versions.sh', 'platform/android/deps.sh') }}
      - name: Cache compiler output
        if: steps.version.outputs.new == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-${{ github.run_id }}
          restore-keys: |
            ccache-release-
            ccache-android-
      - name: SDK packages
        if: steps.version.outputs.new == '1' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "build-tools;36.1.0" "platforms;android-36.1" >/dev/null
      - name: Signing key
        if: steps.version.outputs.new == '1'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "secret ANDROID_KEYSTORE_B64 is missing" >&2; exit 1; }
          mkdir -p ~/.cache/jackdaw/android
          echo "$KEYSTORE" | base64 -d >~/.cache/jackdaw/android/debug.keystore
      - name: Release ${{ steps.version.outputs.tag }}
        if: steps.version.outputs.new == '1'
        run: platform/release.sh
