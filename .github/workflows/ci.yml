# Every PR into main: the Linux build with AddressSanitizer and the key test under a virtual display, and the
# Android APK. Not run again on main: the ruleset merges only a PR that is up to date with main and passed, so
# main holds exactly what was tested (release.yml builds from it).
# Caches: third-party builds (keyed by their pinned versions), the Android SDK packages, and ccache. A PR restores
# what release.yml saved on main (a cache saved on one PR branch is not visible to another).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_MAXSIZE: 1G
  # a restored NDK has new file times; a fresh checkout's files are all newer than the cache
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config autoconf automake libtool make ccache \
            libssl-dev libcurl4-openssl-dev zlib1g-dev libsystemd-dev libsecret-1-dev libfontconfig1-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth
      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jackdaw/linux
            !~/.cache/jackdaw/linux/build
            !~/.cache/jackdaw/linux/build-debug
          key: linux-${{ hashFiles('platform/versions.sh', 'platform/linux/deps.sh') }}
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-debug-${{ github.run_id }}
          restore-keys: |
            ccache-linux-debug-
            ccache-release-
      - name: Build
        run: ccache --zero-stats && platform/linux/build.sh debug
      - name: Tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir ~/.cache/jackdaw/linux/build-debug --output-on-failure
      - name: Compiler cache use
        run: ccache --show-stats | head -8

  android:
    runs-on: ubuntu-24.04
    env:
      # the runner's SDK is root-owned, so a cache restored into it fails and the NDK was downloaded every run;
      # the pinned packages live in a folder of the runner's own instead
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_NDK: /home/runner/android-sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Android SDK packages
        id: sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-sdk
          key: android-sdk-home-ndk28.2.13676358-bt36.1.0-p36.1
      - name: SDK packages
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          SM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SM" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" "build-tools;36.1.0" "platforms;android-36.1" >/dev/null
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build autoconf automake libtool ccache
      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jackdaw/android
            !~/.cache/jackdaw/android/debug.keystore
            !~/.cache/jackdaw/android/out
            !~/.cache/jackdaw/android/apk
            !~/.cache/jackdaw/android/build-*
          key: android-${{ hashFiles('platform/versions.sh', 'platform/android/deps.sh') }}
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: |
            ccache-android-
            ccache-release-
      - name: Build
        run: ccache --zero-stats && platform/android/build.sh
      - name: Compiler cache use
        run: ccache --show-stats | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: jackdaw-apk
          path: ~/.cache/jackdaw/android/out/jackdaw.apk
          retention-days: 7
